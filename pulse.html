<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var r = document.documentElement;
          r.dataset.theme = "system";
          r.dataset.resolvedTheme = dark ? "dark" : "light";
          r.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <title>This week's LPC · EPSynapse</title>
    <meta
      name="description"
      content="This week's LPC at Eastside Prep. Four questions. Counts only."
    />
    <meta property="og:title" content="This week's LPC · EPSynapse" />
    <meta
      property="og:description"
      content="This week's LPC at Eastside Prep. Four questions. Counts only."
    />
    <meta property="og:url" content="https://epsynapse.com/pulse" />
    <link rel="canonical" href="https://epsynapse.com/pulse" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=glass9" />
    <link rel="stylesheet" href="/pulse.css?v=pulse1" />
  </head>
  <body>
    <a
      href="/"
      class="corner c-tl squircle"
      data-liquid-glass="squircle"
      data-filter-id="lg-tl"
      aria-label="Home"
    >
      <span class="corner-mark" aria-hidden="true">E</span>
    </a>

    <button
      type="button"
      class="corner c-tr circle"
      data-liquid-glass="circle"
      data-filter-id="lg-tr"
      aria-label="Toggle theme"
      draggable="false"
    ></button>

    <main class="pulse" id="pulse-root">
      <p class="pulse-kicker">Eastside Prep</p>
      <h1 id="pulse-title">This week's LPC</h1>
      <p class="pulse-blurb" id="pulse-blurb">Four questions. Counts only.</p>
      <p class="pulse-status" id="pulse-status" role="status"></p>

      <form id="pulse-form" autocomplete="off">
        <div id="pulse-questions"></div>

        <section class="pulse-block" id="pulse-grade-block">
          <h2 class="pulse-q">Grade</h2>
          <p class="pulse-hint">Optional. The board can split counts by grade.</p>
          <div class="pulse-chips pulse-chips--grade" id="pulse-grades" role="group" aria-label="Grade"></div>
        </section>

        <button type="submit" class="pulse-send" id="pulse-send" disabled>Send answers</button>
      </form>

      <section class="pulse-thanks" id="pulse-thanks" hidden>
        <h2 class="pulse-thanks-title" id="pulse-thanks-title">Counted.</h2>
        <p class="pulse-thanks-copy" id="pulse-thanks-copy"></p>
        <div id="pulse-results"></div>
        <p class="pulse-board-line">
          <a class="pulse-board" href="/board">Adult board</a>
        </p>
      </section>

      <footer class="pulse-foot">
        <a href="/privacy.html">Privacy</a>
        <span aria-hidden="true">·</span>
        <a href="/board">Board</a>
      </footer>
    </main>

    <svg
      class="liquid-glass-svg"
      xmlns="http://www.w3.org/2000/svg"
      width="0"
      height="0"
      aria-hidden="true"
      focusable="false"
      color-interpolation-filters="sRGB"
      style="position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none"
    >
      <defs id="liquid-glass-defs"></defs>
    </svg>

    <script src="/liquid-glass.js?v=glass8"></script>
    <script src="/theme-orb.js?v=glass6"></script>
    <script src="/pulse.js?v=pulse1"></script>
  </body>
</html>
