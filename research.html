<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var r = document.documentElement;
          r.dataset.theme = "system";
          r.dataset.resolvedTheme = dark ? "dark" : "light";
          r.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <title>Research · EPSynapse</title>
    <meta
      name="description"
      content="Accuracy of the EPSynapse notes classifier, BERT vs fine-tuned BERT."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css?v=logo1" />
  </head>
  <body>
    <a
      href="/"
      class="corner c-tl squircle"
      data-liquid-glass="squircle"
      data-filter-id="lg-tl"
      aria-label="Home"
    >
      <span class="brand-mark" aria-hidden="true">
        <img class="brand-mark-img brand-mark-img--light" src="/logos/mark.png" alt="" />
        <img class="brand-mark-img brand-mark-img--dark" src="/logos/mark-dark.png" alt="" />
      </span>
    </a>

    <button
      type="button"
      class="corner c-tr circle"
      data-liquid-glass="circle"
      data-filter-id="lg-tr"
      aria-label="Toggle theme"
      draggable="false"
    ></button>

    <div class="brand-wordmark" aria-hidden="true">
      <img class="brand-wordmark-img brand-wordmark-img--light" src="/logos/wordmark.png" alt="" />
      <img class="brand-wordmark-img brand-wordmark-img--dark" src="/logos/wordmark-dark.png" alt="" />
    </div>

    <main class="research-page">
      <header class="research-hero">
        <p class="edu-home-mark">Research</p>
        <form class="research-toggles" id="research-toggles">
          <label class="research-switch">
            <input type="checkbox" name="includeUser" />
            <span class="research-switch-ui" aria-hidden="true"></span>
            <span class="research-switch-label" id="research-user-label">Include user tests</span>
          </label>
          <label class="research-switch">
            <input type="checkbox" name="includeFrozen" checked />
            <span class="research-switch-ui" aria-hidden="true"></span>
            <span class="research-switch-label">Include original eval tests</span>
          </label>
          <p class="research-hint" id="research-hint">
            Charts show only the original offline eval run.
          </p>
        </form>
      </header>
      <p class="edu-empty" id="research-status">Loading metrics…</p>
      <div class="research-body" id="research-body" hidden></div>
      <p class="research-updated" id="research-updated" hidden></p>
    </main>

    <svg class="lg-svg" aria-hidden="true">
      <defs id="liquid-glass-defs"></defs>
    </svg>
    <script src="/liquid-glass.js?v=glass13"></script>
    <script src="/theme-orb.js?v=moon6"></script>
    <script src="/research.js?v=research3"></script
  </body>
</html>
