<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var r = document.documentElement;
          r.dataset.theme = "system";
          r.dataset.resolvedTheme = dark ? "dark" : "light";
          r.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <title>EPSynapse</title>
    <meta name="description" content="student dashboard for Eastside Prep" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .od-code {
        margin: 0.35rem 0 0.5rem;
        font-size: 1.55rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <button
      type="button"
      class="corner c-tl squircle"
      data-liquid-glass="squircle"
      data-filter-id="lg-tl"
      id="settings-open"
      aria-label="Open settings"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="currentColor"
          d="M6.2 4h12.1v2.55H9.05v3.7h8.4v2.45h-8.4v4.2H18.6V20H6.2z"
        />
      </svg>
    </button>

    <button
      type="button"
      class="corner c-tr circle"
      data-liquid-glass="circle"
      data-filter-id="lg-tr"
      aria-label="Toggle theme"
      draggable="false"
    ></button>

    <div id="stage-loading" class="stage stage-loading" aria-live="polite">…</div>

    <div id="stage-full" class="stage stage-full" hidden>
      <main id="edu-app" class="edu-app" aria-live="polite"></main>

      <div id="edu-chat" class="yan-chat" data-state="closed">
        <div
          class="yan-chat-panel"
          data-liquid-glass="rounded"
          data-filter-id="lg-edu-chat-panel"
          hidden
          aria-hidden="true"
          role="region"
          aria-label="Personal assistant"
        >
          <button
            type="button"
            class="yan-chat-close yan-chat-close--panel circle"
            data-liquid-glass="circle"
            data-filter-id="lg-edu-chat-x-panel"
            data-edu-chat-clear
            aria-label="New chat"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" style="transform: rotate(45deg)">
              <g fill="currentColor">
                <rect x="10.35" y="4.5" width="3.3" height="15" rx="1.65" />
                <rect x="4.5" y="10.35" width="15" height="3.3" rx="1.65" />
              </g>
            </svg>
          </button>
          <div class="yan-chat-messages" aria-live="polite"></div>
          <div class="yan-chat-history" hidden aria-hidden="true"></div>
        </div>

        <div
          class="yan-chat-pill corner circle c-br"
          data-liquid-glass="circle"
          data-filter-id="lg-edu-chat-pill"
        >
          <button
            type="button"
            class="yan-chat-minimize yan-chat-close yan-chat-close--pill circle"
            data-liquid-glass="circle"
            data-filter-id="lg-edu-chat-minimize"
            data-edu-chat-minimize
            aria-label="Hide chat"
            tabindex="-1"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <g fill="currentColor">
                <rect x="4.5" y="10.35" width="15" height="3.3" rx="1.65" />
              </g>
            </svg>
          </button>

          <button
            type="button"
            class="yan-chat-launcher"
            aria-label="Personal assistant"
            aria-expanded="false"
            aria-controls="edu-chat-input"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <g fill="currentColor">
                <rect x="10.35" y="4.5" width="3.3" height="15" rx="1.65" />
                <rect x="4.5" y="10.35" width="15" height="3.3" rx="1.65" />
              </g>
            </svg>
          </button>

          <form class="yan-chat-form" action="#" autocomplete="off">
            <label class="visually-hidden" for="edu-chat-input">Ask your personal agent</label>
            <textarea
              id="edu-chat-input"
              class="yan-chat-input"
              name="q"
              rows="1"
              inputmode="text"
              enterkeyhint="enter"
              placeholder="Ask your personal agent…"
              maxlength="4000"
              tabindex="-1"
              autocomplete="off"
              wrap="soft"
              aria-multiline="true"
            ></textarea>
            <button
              type="submit"
              class="yan-chat-send circle"
              data-liquid-glass="circle"
              data-filter-id="lg-edu-chat-send"
              aria-label="Send"
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <g stroke="currentColor" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 18.2V6.4" />
                  <path d="M6.9 11.3L12 6.2L17.1 11.3" />
                </g>
              </svg>
            </button>
          </form>
        </div>
      </div>
    </div>

    <div id="settings-sheet" class="edu-sheet-backdrop" hidden>
      <form class="edu-sheet" data-liquid-glass="rounded" data-filter-id="lg-edu-sheet" autocomplete="off">
        <div class="edu-sheet-head">
          <h2 class="edu-panel-title">Settings</h2>
          <button
            type="button"
            id="settings-close"
            class="edu-sheet-close circle"
            data-liquid-glass="circle"
            data-filter-id="lg-edu-sheet-x"
            aria-label="Close settings"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <g fill="currentColor">
                <rect x="4.5" y="10.35" width="15" height="3.3" rx="1.65" transform="rotate(45 12 12)" />
                <rect x="4.5" y="10.35" width="15" height="3.3" rx="1.65" transform="rotate(-45 12 12)" />
              </g>
            </svg>
          </button>
        </div>
        <p class="edu-empty" id="settings-status">School + student ID is your record. Honor system for the hackathon.</p>

        <label for="school">School</label>
        <div class="edu-sheet-field" data-liquid-glass="rounded" data-filter-id="lg-edu-school">
          <input id="school" name="school" value="Eastside Prep" maxlength="80" />
        </div>

        <label for="studentId">Student ID</label>
        <div class="edu-sheet-field" data-liquid-glass="rounded" data-filter-id="lg-edu-sid">
          <input id="studentId" name="studentId" required maxlength="80" />
        </div>

        <label for="canvasHost">Canvas URL</label>
        <div class="edu-sheet-field" data-liquid-glass="rounded" data-filter-id="lg-edu-canvas-host">
          <input id="canvasHost" name="canvasHost" value="https://eastsideprep.instructure.com" />
        </div>

        <label for="canvasToken">Canvas access token</label>
        <div class="edu-sheet-field" data-liquid-glass="rounded" data-filter-id="lg-edu-canvas-token">
          <input id="canvasToken" name="canvasToken" type="password" autocomplete="off" />
        </div>
        <p class="edu-empty">Account → Settings → New Access Token</p>

        <div class="edu-sheet-actions">
          <button type="submit" id="settings-save" class="edu-sheet-btn edu-sheet-btn--gold" data-liquid-glass="rounded" data-filter-id="lg-edu-save">Save</button>
          <button type="button" id="onedrive-start" class="edu-sheet-btn" data-liquid-glass="rounded" data-filter-id="lg-edu-od-start">Connect OneDrive</button>
        </div>
        <p class="edu-empty" id="onedrive-status">School OneDrive. Tap Connect, then sign in with @eastsideprep.org.</p>
        <p id="onedrive-code" class="od-code" hidden></p>
        <a id="onedrive-open" class="edu-empty" href="https://login.microsoft.com/device" target="_blank" rel="noopener" hidden>Open Microsoft sign-in</a>

        <label for="provider">Model</label>
        <div class="edu-sheet-field" data-liquid-glass="rounded" data-filter-id="lg-edu-provider">
          <select id="provider" name="provider"></select>
        </div>

        <label for="modelKey">Model key (stays in this browser)</label>
        <div class="edu-sheet-field" data-liquid-glass="rounded" data-filter-id="lg-edu-model-key">
          <input id="modelKey" name="modelKey" type="password" autocomplete="off" placeholder="Groq / Gemini / OpenRouter" />
        </div>
        <div class="edu-sheet-actions">
          <button type="button" id="key-save" class="edu-sheet-btn edu-sheet-btn--gold" data-liquid-glass="rounded" data-filter-id="lg-edu-key-save">Save key</button>
          <button type="button" id="key-clear" class="edu-sheet-btn" data-liquid-glass="rounded" data-filter-id="lg-edu-key-clear">Clear key</button>
        </div>
        <p class="edu-empty" id="key-status"></p>
      </form>
    </div>

    <svg
      class="liquid-glass-svg"
      xmlns="http://www.w3.org/2000/svg"
      width="0"
      height="0"
      aria-hidden="true"
      focusable="false"
      color-interpolation-filters="sRGB"
      style="position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none"
    >
      <defs id="liquid-glass-defs"></defs>
    </svg>

    <script src="/liquid-glass.js"></script>
    <script src="/theme-orb.js"></script>
    <script src="/app.js"></script>
    <script src="/chatbot.js"></script>
  </body>
</html>
