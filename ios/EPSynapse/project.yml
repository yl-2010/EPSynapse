name: EPSynapse
options:
  bundleIdPrefix: com.jype
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: 9KM694AP8A
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: "9.2.0"

targets:
  EPSynapse:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    sources:
      - path: EPSynapse
        excludes:
          - Info.plist
      - path: EPSynapse/Assets.xcassets
        buildPhase: resources
      - path: EPSynapse/LaunchScreen.storyboard
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jype.epsynapse
        PRODUCT_NAME: EPSynapse
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: EPSynapse/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: EPSynapse
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 9KM694AP8A
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
    info:
      path: EPSynapse/Info.plist
      properties:
        CFBundleDisplayName: EPSynapse
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - canvas-courses
          - google
        GIDClientID: 873841837124-ocu4kaka0t0j6fbsur11s4ajde8ha5u1.apps.googleusercontent.com
        GIDServerClientID: 873841837124-i6id79rarolm7ii4aima4fojotghk2r5.apps.googleusercontent.com
        EPSGoogleiOSClientID: 873841837124-ocu4kaka0t0j6fbsur11s4ajde8ha5u1.apps.googleusercontent.com
        EPSGoogleReversedClientID: com.googleusercontent.apps.873841837124-ocu4kaka0t0j6fbsur11s4ajde8ha5u1
        EPSApiBaseURL: https://api.epsynapse.com
        EPSLocalApiBaseURL: http://127.0.0.1:3006
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.jype.epsynapse.google
            CFBundleURLSchemes:
              - com.googleusercontent.apps.873841837124-ocu4kaka0t0j6fbsur11s4ajde8ha5u1
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.jype.epsynapse.microsoft
            CFBundleURLSchemes:
              - epsynapse
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Debug only. The post-build script below deletes this dictionary from
        # Release builds, which only ever talk to https://api.epsynapse.com.
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
    postBuildScripts:
      - name: Strip local ATS exceptions (Release)
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          # localhost / 127.0.0.1 cleartext exists for the simulator against the Mac API.
          # XcodeGen writes one Info.plist for every configuration, so drop it here.
          if [ "$CONFIGURATION" = "Release" ]; then
            PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
            if /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$PLIST" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST"
            fi
          fi

schemes:
  EPSynapse:
    build:
      targets:
        EPSynapse: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
