<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var r = document.documentElement;
          r.dataset.theme = "system";
          r.dataset.resolvedTheme = dark ? "dark" : "light";
          r.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <title>Not found · EPSynapse</title>
    <meta name="description" content="This page is not in EPSynapse." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=glass13" />
    <style>
      a.corner {
        text-decoration: none;
      }
      .page-wrap {
        display: flex;
        justify-content: center;
        box-sizing: border-box;
        min-height: 100dvh;
        padding: 6.5rem 1rem 2rem;
      }
      .page-sheet {
        max-height: min(52rem, calc(100dvh - 8rem));
      }
      .page-sheet .edu-sheet-body p {
        margin: 0 0 0.75rem;
        font-size: var(--text-subhead);
        line-height: 1.45;
        color: var(--fg);
      }
      .page-sheet .edu-sheet-body a {
        color: var(--accent);
      }
      .page-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.1rem;
        margin-top: 0.35rem;
      }
    </style>
  </head>
  <body>
    <a
      href="/"
      class="corner c-tl squircle"
      data-liquid-glass="squircle"
      data-filter-id="lg-tl"
      aria-label="Home"
    >
      <span class="corner-mark" aria-hidden="true">E</span>
    </a>

    <button
      type="button"
      class="corner c-tr circle"
      data-liquid-glass="circle"
      data-filter-id="lg-tr"
      aria-label="Toggle theme"
      draggable="false"
    ></button>

    <div class="page-wrap">
      <main class="edu-sheet page-sheet">
        <div class="edu-sheet-head">
          <h1 class="edu-sheet-title">Not found</h1>
        </div>
        <div class="edu-sheet-body">
          <p>This page is not in EPSynapse.</p>
          <p class="page-links">
            <a href="/">Home</a>
            <a href="/privacy">Privacy</a>
            <a href="/groq">Groq key</a>
          </p>
        </div>
      </main>
    </div>

    <svg
      class="liquid-glass-svg"
      xmlns="http://www.w3.org/2000/svg"
      width="0"
      height="0"
      aria-hidden="true"
      focusable="false"
      color-interpolation-filters="sRGB"
      style="position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none"
    >
      <defs id="liquid-glass-defs"></defs>
    </svg>

    <script src="/liquid-glass.js?v=glass11"></script>
    <script src="/theme-orb.js?v=glass9"></script>
  </body>
</html>
